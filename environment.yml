# Conda environment for canopy-growth.
#   conda env create -f environment.yml
#   conda activate canopy-growth
#   pip install -e . --no-deps
name: canopy-growth
channels:
  - conda-forge
  - nodefaults
# Versions pinned to major.minor, so a rebuilt environment gives the same results.
# Raise a pin in its own pull request, with the tests green.
dependencies:
  - python=3.12
  # PDAL core and the pdal command only. The full 'pdal' package also installs
  # all reader/writer plugins; the HDF ones are built against another HDF5 and
  # fail to load on every start. Add a plugin package here only when it is used.
  - libpdal-core=2.10
  - python-pdal=3.5
  - gdal=3.13
  - rasterio=1.5
  - geopandas=1.2
  - numpy=2.5
  - pyyaml=6.0
  - pytest=9
  - ipykernel=7.4  # run notebooks in this environment (VS Code, Jupyter)
  - matplotlib-base=3.11  # figures in notebooks and QC reports (no Qt GUI)
  - pip
