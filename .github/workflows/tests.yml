name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # monthly run on the 1st at 06:17 UTC: shows the environment still builds
    - cron: "17 6 1 * *"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Install the package
        run: pip install -e . --no-deps
      - name: Run tests
        run: pytest -v
